server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json application/ld+json image/svg+xml text/plain application/xml;

  location /assets/ {
    expires 1y;
  }
  location ~* \.(png|svg|ico|webmanifest)$ {
    expires 7d;
  }
  location ~ ^/(robots\.txt|sitemap\.xml)$ {
    expires 1h;
  }
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
